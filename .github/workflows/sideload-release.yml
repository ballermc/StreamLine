name: Sideload Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version/tag to create for the draft release (e.g. v3.0.1)
        required: true

# The build jobs attach assets to the release, which requires write access to
# repo contents. The default GITHUB_TOKEN is read-only when the repo's default
# workflow permissions are restricted, causing "Resource not accessible by
# integration" on upload.
permissions:
  contents: write

# The requested version labels the draft release and packaged assets. The
# source code is checked out from the ref selected when manually dispatching.
env:
  RELEASE_TAG: ${{ inputs.tag }}
  # LumeEngine (the beta 4th playback engine) is referenced by the project as a
  # *local* SPM package at ../LumeEngine, so the sibling repo has to exist on the
  # runner or `xcodebuild archive` dies at "Could not resolve package
  # dependencies" before compiling anything.
  #
  # Pinned rather than tracking the engine's main: app↔engine commits are paired
  # by hand, so a drifting engine would break this archive with no change on
  # Lume's side. Bump this when a release needs newer engine code.
  ENGINE_REF: v0.4.0
  # LumeRecorderKit (the DVR client) is the same story: a local package at
  # ../LumeRecorder/Kit, pinned to the LumeRecorder tag the app was built with.
  RECORDER_REF: v0.1.1
  # LumeCloudKit (the Lume Cloud sync client) likewise: a local package at
  # ../LumeCloud/LumeCloudKit. Tracks main until LumeCloud cuts its first tag.
  CLOUD_REF: main

jobs:
  build:
    name: Build ${{ matrix.platform }} Sideload
    # Must build with the same Xcode major as the App Store archives
    # (ship-release, local Xcode 27): the linked SDK decides SDK-gated behaviour
    # such as iPhone Duo layout — an iOS 26 SDK IPA runs in compatibility mode
    # there. macos-26 only ships Xcode 26, so use the xcode-27 image (macOS 27).
    # (Never macos-15: the macOS icon's AssetCatalogAgent compile crashes there
    # with a dyld MediaToolbox/AVFCore symbol mismatch.) iOS/tvOS build here
    # too, so all platforms share one image.
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
            format: ipa
          - platform: tvOS
            destination: generic/platform=tvOS
            format: ipa
          - platform: macOS
            destination: generic/platform=macOS
            format: zip

    # Every `run` step works inside the app checkout (see the sibling-layout note
    # on the checkout steps). Packaging steps use absolute $RUNNER_TEMP paths and
    # are unaffected.
    defaults:
      run:
        working-directory: Lume

    steps:
      # Lume, LumeEngine, LumeRecorder and LumeCloud are checked out as
      # *siblings* rather than the app sitting at the workspace root, because the
      # project references the engine and the two kits by relative path
      # (../LumeEngine, ../LumeRecorder/Kit, ../LumeCloud/LumeCloudKit) and
      # actions/checkout refuses any `path` outside $GITHUB_WORKSPACE. All four
      # therefore live one level down inside it.
      - name: Checkout Lume
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: Lume

      # No FFmpeg build needed: with BinaryDependencies/ absent (it's gitignored,
      # so a fresh clone never has it) the engine's Package.swift falls back to a
      # checksum-pinned FFmpeg.xcframework downloaded from a GitHub release.
      - name: Checkout LumeEngine
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ env.ENGINE_REF }}
          path: LumeEngine

      # The v0.3.0 FFmpeg artifact still places CFFmpeg's module map at the
      # Headers root. Xcode flattens every static xcframework's Headers/
      # directory into one include directory, so that collides with LibDovi's
      # module.modulemap when AetherEngine is linked. Repack the verified
      # artifact into the layout produced by LumeEngine's upstream fix.
      - name: Prepare LumeEngine FFmpeg headers
        working-directory: Lume
        run: bash Scripts/prepare-lumeengine-binary.sh ../LumeEngine

      - name: Checkout LumeRecorder
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeRecorder
          ref: ${{ env.RECORDER_REF }}
          path: LumeRecorder

      - name: Checkout LumeCloud
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeCloud
          ref: ${{ env.CLOUD_REF }}
          path: LumeCloud

      # Pinned, not latest-stable: latest-stable silently fell back to Xcode 26
      # (iOS 26.5 SDK) while the App Store build used 27. Keep this on the
      # Xcode ship-release archives with; bump both together.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      # ── Metal Toolchain ──────────────────────────────────────────────────────
      # Xcode 26 no longer bundles the Metal toolchain; without it KSPlayer's
      # Shaders.metal fails to compile ("cannot execute tool 'metal' due to
      # missing Metal Toolchain"). Download it before archiving.
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Resolve app version
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be three numeric components, optionally prefixed with v (for example v3.0.1)."
            exit 1
          fi
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building app version $VERSION"

      # ── Inject API key secrets (optional) ───────────────────────────────────
      # Features degrade gracefully when absent (see Scripts/inject-env.sh).
      - name: Write .env
        env:
          # Key names MUST match what Scripts/inject-env.sh reads (read_env …).
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          INTRO_DB_API_KEY: ${{ secrets.INTRO_DB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          {
            [ -n "$TMDB_ACCESS_TOKEN" ]     && echo "TMDB_ACCESS_TOKEN=$TMDB_ACCESS_TOKEN"
            [ -n "$MDBLIST_API_KEY" ]       && echo "MDBLIST_API_KEY=$MDBLIST_API_KEY"
            [ -n "$INTRO_DB_API_KEY" ]      && echo "INTRO_DB_API_KEY=$INTRO_DB_API_KEY"
            [ -n "$OPENSUBTITLES_API_KEY" ] && echo "OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY"
            [ -n "$TRAKT_CLIENT_ID" ]       && echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ]   && echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ]       && echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID"
            [ -n "$SIMKL_CLIENT_SECRET" ]   && echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET"
            [ -n "$MDBLIST_CLIENT_ID" ]     && echo "MDBLIST_CLIENT_ID=$MDBLIST_CLIENT_ID"
          } > .env || true

      # ── Archive (unsigned) ───────────────────────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO skips all signing. The resulting .app is unsigned;
      # users re-sign it themselves (iOS/tvOS via AltStore/Sideloadly,
      # macOS via right-click → Open to bypass Gatekeeper).
      - name: Archive (Sideload, unsigned)
        run: |
          xcodebuild archive \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Sideload \
            -destination '${{ matrix.destination }}' \
            -archivePath "$RUNNER_TEMP/Lume-Sideload.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="$MARKETING_VERSION"

      # ── Package: IPA (iOS / tvOS) ────────────────────────────────────────────
      # An IPA is a zip with Payload/<AppName>.app at its root.
      - name: Package IPA
        if: matrix.format == 'ipa'
        run: |
          VERSION="$RELEASE_TAG"
          APP=$(find "$RUNNER_TEMP/Lume-Sideload.xcarchive/Products" -name "*.app" | head -1)

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/Lume-${VERSION}-${{ matrix.platform }}-Sideload.ipa" Payload

      # ── Package: zip (macOS) ────────────────────────────────────────────────
      # ditto preserves symlinks and resource forks inside the .app bundle.
      # plain zip would break the bundle's internal structure.
      - name: Package zip
        if: matrix.format == 'zip'
        run: |
          VERSION="$RELEASE_TAG"
          APP=$(find "$RUNNER_TEMP/Lume-Sideload.xcarchive/Products" -name "*.app" | head -1)

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RUNNER_TEMP/Lume-${VERSION}-macOS-Sideload.zip"

      # Collect each platform asset so one downstream job creates the draft
      # release once and attaches all three files together.
      - name: Upload sideload asset
        uses: actions/upload-artifact@v4
        with:
          name: sideload-${{ matrix.platform }}
          path: ${{ runner.temp }}/Lume-${{ env.RELEASE_TAG }}-${{ matrix.platform }}-Sideload.${{ matrix.format }}
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download sideload assets
        uses: actions/download-artifact@v4
        with:
          pattern: sideload-*
          path: ${{ runner.temp }}/sideload-assets
          merge-multiple: true

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: ${{ runner.temp }}/sideload-assets/Lume-*
